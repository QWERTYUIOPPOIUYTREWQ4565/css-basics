<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gilroy</title>

    <style>
        @font-face {
            font-family: "Gilroy";
            src: url("https://cdn.jsdelivr.net/gh/repalash/gilroy-free-webfont@fonts/Gilroy-Light.woff") format("woff");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Gilroy";
            src: url("https://cdn.jsdelivr.net/gh/repalash/gilroy-free-webfont@fonts/Gilroy-Extrabold.woff") format("woff");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: "Gilroy", sans-serif;
        }

        h1 {
            font-weight: 800;
        }

        p {
            font-weight: 300;
        }
    </style>
</head>

<body>

    <h1>This is Gilroy ExtraBold</h1>
    <p>This is Gilroy Light</p>

</body>
</html>
